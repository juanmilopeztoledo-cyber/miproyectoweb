<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Juanmi López</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top py-4">
        <div class="container-fluid px-4 px-md-5">
            <div class="d-flex w-100 justify-content-between align-items-center">
                <!-- Left Links -->
                <div class="d-none d-lg-flex nav-links">
                    <a href="index.html">Work</a>
                    <a href="contact.html" class="active">Contact</a>
                    <a href="about.html">About me</a>
                </div>
                
                <!-- Center Logo -->
                <a class="navbar-brand text-center fw-black logo-text m-0" href="index.html">JUANMILÓPEZ</a>
                
                <!-- Right Icons -->
                <div class="d-flex nav-icons">
                    <a href="https://www.instagram.com/juanmivisuals/" target="_blank"><i class="bi bi-instagram"></i></a>
                    <a href="contact.html" class="active"><i class="bi bi-envelope-fill"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <main class="container py-5 mt-4">
        <div class="row justify-content-center m-0">
            <div class="col-12" style="max-width: 600px; padding: 0;">
                <div class="text-center mb-5">
                    <h1 class="fw-black mb-3 text-dark" style="font-size: 3.5rem; letter-spacing: -1px;">Contact</h1>
                    <p class="text-secondary mb-4">Interested in working together or just want to say hi?</p>
                    <p class="fw-bold mb-5"><a href="mailto:juanmi.photos@gmail.com" class="text-dark text-decoration-none">juanmi.photos@gmail.com</a></p>
                </div>
                
                <form class="text-start about-text w-100">
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase letter-spacing-1">Name</label>
                        <input type="text" class="form-control form-control-lg border-0 bg-light rounded-0" placeholder="Your name">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase letter-spacing-1">Email Address</label>
                        <input type="email" class="form-control form-control-lg border-0 bg-light rounded-0" placeholder="Your email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase letter-spacing-1">Message</label>
                        <textarea class="form-control form-control-lg border-0 bg-light rounded-0" rows="5" placeholder="Message"></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold py-3 mt-2 rounded-0 text-uppercase letter-spacing-1">Submit</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-5 mt-5">
        <p class="text-muted small m-0 letter-spacing-1 text-uppercase">&copy; 2026 Juanmi López.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
